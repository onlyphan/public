<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma Trận Cảnh Báo BeMS (Phân loại Stick - Pin)</title>
  <style>
    :root {
      --bg: #FFFFFF;
      --card-bg: #FFFFFF;
      --border: #E5E7EB;
      --border-dark: #D1D5DB;
      --text-main: #111827;
      --text-muted: #4B5563;
      --text-sub: #6B7280;
      --row-hover: #F9FAFB;
      --code-bg: #F3F4F6;
      
      /* Mức độ: Đơn sắc & trung tính, không rực rỡ */
      --danger-text: #991B1B;
      --warning-text: #92400E;
      --info-text: #374151;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #F9FAFB;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      padding: 32px 24px;
      font-size: 13px;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 24px 28px;
    }

    /* HEADER */
    .header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .header p {
      color: var(--text-sub);
      font-size: 13px;
    }

    /* STATS & METRICS */
    .stats-row {
      display: flex;
      gap: 20px;
      margin-top: 14px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .stats-row span strong {
      color: var(--text-main);
      font-weight: 600;
    }

    /* CONTROLS BAR */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tabs {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      background: #FFFFFF;
    }

    .tab-btn {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      border: none;
      border-right: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }

    .tab-btn:last-child {
      border-right: none;
    }

    .tab-btn:hover {
      background: #F3F4F6;
      color: var(--text-main);
    }

    .tab-btn.active {
      background: #111827;
      color: #FFFFFF;
    }

    .filters-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      justify-content: flex-end;
    }

    .search-box {
      width: 280px;
    }

    .search-box input {
      width: 100%;
      padding: 6px 10px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #FFFFFF;
      color: var(--text-main);
      outline: none;
    }

    .search-box input:focus {
      border-color: #4B5563;
    }

    .level-select {
      padding: 6px 10px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #FFFFFF;
      color: var(--text-muted);
      outline: none;
      cursor: pointer;
    }

    /* TABLE */
    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--border);
      text-align: left;
    }

    thead th {
      background: #F9FAFB;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-dark);
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: var(--row-hover);
    }

    td {
      padding: 12px 14px;
      vertical-align: top;
      font-size: 12.5px;
      line-height: 1.45;
    }

    .td-stt {
      width: 40px;
      text-align: center;
      color: var(--text-sub);
      font-size: 12px;
    }

    .td-name {
      width: 250px;
    }

    .alert-title {
      font-weight: 600;
      color: var(--text-main);
      display: block;
      margin-bottom: 3px;
    }

    .type-tag {
      font-size: 11px;
      color: var(--text-sub);
      display: inline-block;
    }

    .td-level {
      width: 90px;
      white-space: nowrap;
    }

    .level-text {
      font-size: 11.5px;
      font-weight: 600;
    }

    .level-danger {
      color: var(--danger-text);
    }

    .level-warning {
      color: var(--warning-text);
    }

    .level-info {
      color: var(--info-text);
    }

    .td-trigger {
      width: 420px;
    }

    .code-cond {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
      background: var(--code-bg);
      border: 1px solid #E5E7EB;
      border-radius: 3px;
      padding: 2px 6px;
      color: #1F2937;
      display: inline-block;
      margin-bottom: 3px;
      word-break: break-word;
    }

    .desc-cond {
      color: var(--text-sub);
      font-size: 11.5px;
      line-height: 1.4;
    }

    .td-action {
      color: var(--text-main);
    }

    .action-text {
      font-size: 12px;
      color: #374151;
    }

    .empty-msg {
      text-align: center;
      padding: 30px;
      color: var(--text-sub);
      font-style: italic;
    }

    .footer {
      margin-top: 16px;
      font-size: 11px;
      color: var(--text-sub);
      text-align: right;
    }
  </style>
</head>
<body>

<div class="container">
  
  <div class="header">
    <h1>Ma trận cảnh báo BeMS (Phân loại Stick - Pin)</h1>
    <div class="stats-row">
      <span>Tổng số: <strong id="statTotal">32</strong></span>
      <span>Cảnh báo Pin: <strong id="statPin">16</strong></span>
      <span>Cảnh báo Stick: <strong id="statStick">16</strong></span>
      <span>Khẩn cấp: <strong id="statDanger">8</strong></span>
    </div>
  </div>

  <div class="controls">
    <div class="tabs">
      <button class="tab-btn active" data-type="all" onclick="setTab('all')">Tất cả (32)</button>
      <button class="tab-btn" data-type="pin" onclick="setTab('pin')">Cảnh báo Pin (16)</button>
      <button class="tab-btn" data-type="stick" onclick="setTab('stick')">Cảnh báo Stick (16)</button>
    </div>

    <div class="filters-right">
      <select id="levelSelect" class="level-select" onchange="applyFilter()">
        <option value="all">Tất cả mức độ</option>
        <option value="danger">Khẩn cấp</option>
        <option value="warning">Cảnh báo</option>
        <option value="info">Thông tin</option>
      </select>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Tìm kiếm cảnh báo..." onkeyup="applyFilter()">
      </div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th class="td-stt">STT</th>
        <th>Tên cảnh báo & Phân loại</th>
        <th>Mức độ</th>
        <th>Nguồn kích hoạt gốc (Điều kiện kích hoạt)</th>
        <th>Hành động</th>
      </tr>
    </thead>
    <tbody id="tableBody">
    </tbody>
  </table>

  <div class="footer">
    Hệ thống BeMS • Cập nhật ngày 05/10/2026
  </div>

</div>

let selectedTab = 'all';

function updateStats() {
  const pinCount = data.filter(d => d.type === 'pin').length;
  const stickCount = data.filter(d => d.type === 'stick').length;
  const dangerCount = data.filter(d => d.level === 'danger').length;

  document.getElementById('statTotal').textContent = data.length;
  document.getElementById('statPin').textContent = pinCount;
  document.getElementById('statStick').textContent = stickCount;
  document.getElementById('statDanger').textContent = dangerCount;

  document.querySelector('.tab-btn[data-type="all"]').textContent = `Tất cả (${data.length})`;
  document.querySelector('.tab-btn[data-type="pin"]').textContent = `Cảnh báo Pin (${pinCount})`;
  document.querySelector('.tab-btn[data-type="stick"]').textContent = `Cảnh báo Stick (${stickCount})`;
}

function renderTable(items) {
  const tbody = document.getElementById('tableBody');
  if (!items || items.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-msg">Không có cảnh báo phù hợp với tìm kiếm.</td></tr>';
    return;
  }

  tbody.innerHTML = items.map((item, idx) => {
    let levelClass = 'level-info';
    if (item.level === 'danger') levelClass = 'level-danger';
    if (item.level === 'warning') levelClass = 'level-warning';

    return `
      <tr>
        <td class="td-stt">${idx + 1}</td>
        <td class="td-name">
          <span class="alert-title">${item.name}</span>
          <span class="type-tag">[Cảnh báo từ ${item.typeName}]</span>
        </td>
        <td class="td-level">
          <span class="level-text ${levelClass}">${item.levelName}</span>
        </td>
        <td class="td-trigger">
          <div class="code-cond">${item.condCode}</div>
          <div class="desc-cond">${item.condDesc}</div>
        </td>
        <td class="td-action">
          <div class="action-text">${item.action}</div>
        </td>
      </tr>
    `;
  }).join('');
}

function applyFilter() {
  const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
  const selectedLevel = document.getElementById('levelSelect').value;

  const filtered = data.filter(item => {
    if (selectedTab !== 'all' && item.type !== selectedTab) return false;
    if (selectedLevel !== 'all' && item.level !== selectedLevel) return false;
    if (keyword) {
      const matchName = item.name.toLowerCase().includes(keyword);
      const matchCond = item.condCode.toLowerCase().includes(keyword) || item.condDesc.toLowerCase().includes(keyword);
      const matchAction = item.action.toLowerCase().includes(keyword);
      return matchName || matchCond || matchAction;
    }
    return true;
  });

  renderTable(filtered);
}

function setTab(tab) {
  selectedTab = tab;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-type') === tab);
  });
  applyFilter();
}

// Khởi chạy
updateStats();
renderTable(data);
</script>
